name: CI

'on':
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-22.04
    env:
      NUMPY_VERSION: '1.18'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - run: pip install -q numpy~=$NUMPY_VERSION
      - run: pip install -e .[dev]
      - run: pip install codecov
      - run: make lint
      - run: codecov

  test_numpy_1_14:
    name: Numpy 1.14
    runs-on: ubuntu-22.04
    env:
      NUMPY_VERSION: '1.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.6'
      - run: pip install -q numpy~=$NUMPY_VERSION
      - run: pip install -e .[dev]
      - run: pip install codecov
      - run: make test
      - run: codecov

  python_3_6:
    name: Python 3.6
    runs-on: ubuntu-22.04
    env:
      NUMPY_VERSION: '1.18'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.6'
      - run: pip install -q numpy~=$NUMPY_VERSION
      - run: pip install -e .[dev]
      - run: pip install codecov
      - run: make test
      - run: codecov

  python_3_7:
    name: Python 3.7
    runs-on: ubuntu-22.04
    env:
      NUMPY_VERSION: '1.18'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - run: pip install -q numpy~=$NUMPY_VERSION
      - run: pip install -e .[dev]
      - run: pip install codecov
      - run: make test
      - run: codecov

  python_3_8:
    name: Python 3.8
    runs-on: ubuntu-22.04
    env:
      NUMPY_VERSION: '1.18'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: sudo apt-get install libtbb-dev
      - run: pip install cython
      - run: pip install -q numpy~=$NUMPY_VERSION
      - run: pip install -e .[dev]
      - run: pip install codecov
      - run: make test
      - run: codecov

  documentation:
    name: Documentation
    runs-on: ubuntu-22.04
    env:
      NUMPY_VERSION: '1.18'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - run: pip install -q numpy~=$NUMPY_VERSION
      - run: pip install -e .[dev]
      - run: pip install codecov
      - run: make test-docs
      - run: codecov

  deploy:
    name: Deploy
    runs-on: ubuntu-22.04
    needs:
      - linting
      - test_numpy_1_14
      - python_3_6
      - python_3_7
      - python_3_8
      - documentation
    if: startsWith(github.ref, 'refs/tags/')
    env:
      NUMPY_VERSION: '1.18'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - run: pip install -q numpy~=$NUMPY_VERSION
      - run: pip install -e .[dev]
      - run: pip install codecov
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: malramsay64
          password: ''